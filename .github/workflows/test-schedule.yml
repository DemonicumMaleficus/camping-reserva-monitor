name: Test Schedule

on:
  push:
    branches:
      - main

  schedule:
    - cron: "5 19 * * *"

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Comprobar ejecución
        run: |
          echo "WORKFLOW EJECUTADO"
          echo "Evento: ${{ github.event_name }}"
          echo "Hora UTC:"
          date -u
