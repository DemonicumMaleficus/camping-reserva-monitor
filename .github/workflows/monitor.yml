name: Comprobar disponibilidad Camping La Plata

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Comprobar disponibilidad
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python check_reserva.py

      - name: Prueba de correo
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          msg = EmailMessage()
          msg["Subject"] = "PRUEBA - Monitor Camping La Plata"
          msg["From"] = os.environ["SMTP_USER"]
          msg["To"] = os.environ["EMAIL_TO"]
          msg.set_content(
              "Este es un correo de prueba del monitor de reservas.\n\n"
              "Si recibes este mensaje, el sistema de alertas funciona correctamente."
          )

          with smtplib.SMTP(
              os.environ["SMTP_HOST"],
              int(os.environ["SMTP_PORT"])
          ) as server:
              server.starttls()
              server.login(
                  os.environ["SMTP_USER"],
                  os.environ["SMTP_PASSWORD"]
              )
              server.send_message(msg)

          print("Correo de prueba enviado correctamente.")
          PY
